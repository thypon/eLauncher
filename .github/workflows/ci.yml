name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  bdd-and-coverage-gate:
    name: Cucumber BDD suite + 80% coverage gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      code-quality: write
    steps:
      - uses: actions/checkout@v4 # 11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up JDK 21
        uses: actions/setup-java@v4 # c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '21'

      # ubuntu-latest images ship ANDROID_HOME preinstalled with common platforms/build-tools.

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4 # 42ebad84b0585498c0413b0967cf4e80ec0e1d19

      # Runs all Cucumber/Robolectric scenarios, unit tests, lint (non-aborting)
      # and the JaCoCo line-coverage gate (minimum 80%).
      - name: Check (tests + coverage gate)
        run: ./gradlew check --stacktrace

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: jacoco-coverage-report
          path: app/build/reports/jacoco/jacocoUnitTestReport/

      # Convert JaCoCo XML to Cobertura XML and upload to GitHub Code Quality,
      # which backs the "Restrict code coverage" branch ruleset on master.
      - name: Convert coverage to Cobertura
        run: python3 scripts/cover2cover.py app/build/reports/jacoco/jacocoUnitTestReport/jacocoUnitTestReport.xml app/src/main/java > cobertura.xml

      - name: Upload coverage to GitHub Code Quality
        uses: actions/upload-code-coverage@d8e329117199404bba6fc81efe8093dc7c015e34 # v1.0.0
        with:
          file: cobertura.xml
          language: Java
          label: code-coverage/jacoco
          # Best effort until GitHub Code Quality is enabled on the repo
          # (requires Team/Enterprise plan); the upload API 404s otherwise.
          fail-on-error: false
