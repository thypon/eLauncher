name: security
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main, master, staging, development, devel, dev]
  merge_group:
permissions:
  contents: read
  issues: write
  pull-requests: write
jobs:
  security:
    name: security
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
      - uses: brave/security-action/actions/main@a5b7ab1827564347089f3fe3f29cac42d833d3b4 # main
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}